<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>C-Server Solitaire</title>
    <!-- Bootstrap 5 CDN -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #198754; /* Bootstrap 'success' green */
        }

        /*
          We still need fixed dimensions for cards so they don't stretch
          weirdly when the text inside them changes.
        */
        .card-dim {
            width: 100px;
            height: 140px;
        }

        /* The blue pattern for face-down cards */
        .face-down-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.15) 10px, rgba(255,255,255,0.15) 20px);
        }
    </style>
</head>
<body class="text-white pb-5">

<div class="container mt-4">

    <!-- HEADER & CONTROLS -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="display-5 fw-bold text-light">Solitaire Terminal</h1>
            <p class="fs-5">
                Status: <span class="badge bg-primary" th:text="${gameBoard.status != null ? gameBoard.status : 'DISCONNECTED'}"></span>
                <span class="mx-2">|</span>
                Phase: <span class="badge bg-secondary" th:text="${gameBoard.phase != null ? gameBoard.phase : 'UNKNOWN'}"></span>
            </p>
        </div>
        <div class="col-md-5">
            <div class="card bg-dark text-white border-secondary shadow">
                <div class="card-body">
                    <form action="/command" method="POST" class="m-0">
                        <label for="commandInput" class="form-label text-light">Send Command:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="commandInput" name="command" placeholder="e.g. P, LD, C1:7H->C2" autocomplete="off" required>
                            <button class="btn btn-warning fw-bold" type="submit">Execute</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME BOARD -->
    <div th:if="${gameBoard.status != null and gameBoard.status != 'ERROR'}">

        <!-- TOP ROW: Foundations -->
        <div class="d-flex justify-content-end gap-3 mb-5" style="min-height: 140px;">
            <div th:each="foundationList, stat : ${ {gameBoard.f1, gameBoard.f2, gameBoard.f3, gameBoard.f4} }"
                 class="card-dim position-relative">

                <!-- Empty Foundation -->
                <div th:if="${foundationList.empty}"
                     class="card-dim rounded border border-2 border-light border-opacity-25 d-flex align-items-center justify-content-center text-light opacity-50">
                    <span class="fs-4 fw-bold" th:text="'F' + ${stat.count}"></span>
                </div>

                <!-- Populated Foundation (Top Card Only) -->
                <div th:if="${!foundationList.empty}"
                     th:with="topCard=${foundationList[foundationList.size() - 1]}"
                     class="card-dim rounded bg-white shadow d-flex align-items-center justify-content-center border"
                     th:classappend="${topCard.suit == 'H' or topCard.suit == 'D'} ? 'text-danger' : 'text-dark'">
                    <span class="fs-3 fw-bold" th:text="${topCard.rank} + ${topCard.suit}"></span>
                </div>
            </div>
        </div>

        <!-- BOTTOM ROW: 7 Columns -->
        <div class="d-flex justify-content-center gap-3">
            <div th:each="columnList, stat : ${ {gameBoard.c1, gameBoard.c2, gameBoard.c3, gameBoard.c4, gameBoard.c5, gameBoard.c6, gameBoard.c7} }"
                 class="card-dim position-relative">

                <!-- Empty Column -->
                <div th:if="${columnList.empty}"
                     class="card-dim rounded border border-2 border-light border-opacity-25 d-flex align-items-center justify-content-center text-light opacity-50">
                    <span class="fs-4 fw-bold" th:text="'C' + ${stat.count}"></span>
                </div>

                <!-- Overlapping Cards -->
                <div th:each="card, cardStat : ${columnList}"
                     class="card-dim rounded shadow position-absolute d-flex align-items-center justify-content-center border"
                     th:style="'top: ' + (${cardStat.index} * 30) + 'px; z-index: ' + ${cardStat.index}"
                     th:classappend="${!card.visible} ? 'bg-primary border-white face-down-pattern' : 'bg-white ' + (${card.suit == 'H' or card.suit == 'D'} ? 'text-danger' : 'text-dark')">

                    <span th:if="${card.visible}" class="fs-3 fw-bold" th:text="${card.rank} + ${card.suit}"></span>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
