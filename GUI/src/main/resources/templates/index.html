<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>C-Server Solitaire</title>
    <!-- Bootstrap 5 CDN -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #198754; /* Bootstrap 'success' green */
        }

        /*
          We still need fixed dimensions for cards so they don't stretch
          weirdly when the text inside them changes.
        */
        .card-dim {
            width: 100px;
            height: 140px;
        }

        /* The blue pattern for face-down cards */
        .face-down-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.15) 10px, rgba(255,255,255,0.15) 20px);
        }
        /* Hides the actual radio button circle */
        .hidden-radio {
            display: none;
        }

        /* When the hidden radio is checked, add a yellow border to the label's card div immediately after it */
        .hidden-radio:checked + label > div {
            border: 4px solid #ffc107 !important;
            transform: translateY(-5px); /* Pops the card up slightly so you know it's selected */
            z-index: 100 !important;
        }

        /* Style for pure HTML destination buttons */
        .drop-btn {
            width: 100px;
            height: 40px;
            margin-top: 10px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .drop-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="text-white pb-5">

<div class="container mt-4">

    <!-- HEADER & CONTROLS -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="display-5 fw-bold text-light">Solitaire Terminal</h1>
            <p class="fs-5">
                Status: <span class="badge bg-primary" th:text="${gameBoard.status != null ? gameBoard.status : 'DISCONNECTED'}"></span>
                <span class="mx-2">|</span>
                Phase: <span class="badge bg-secondary" th:text="${gameBoard.phase != null ? (gameBoard.phase == '0' ? 'startup' : 'play') : 'UNKNOWN'}"></span>
            </p>
        </div>
        <div class="col-md-5">
            <div class="card bg-dark text-white border-secondary shadow">
                <div class="card-body">
                    <form action="/command" method="POST" class="m-0">
                        <label for="commandInput" class="form-label text-light">Send Command:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="commandInput" name="command" placeholder="e.g. P, LD, C1:7H->C2" autocomplete="off" required>
                            <button class="btn btn-warning fw-bold" type="submit">Execute</button>
                        </div>
                    </form>
                    <!-- QUICK ACTIONS BUTTONS -->
                    <form action="/command" method="POST" class="mt-3">
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <button type="submit" name="command" value="SR" class="btn btn-sm btn-outline-info">Shuffle (SR)</button>
                            <button type="submit" name="command" value="P" class="btn btn-sm btn-success fw-bold">Play (P)</button>
                            <button type="submit" name="command" value="Q" class="btn btn-sm btn-warning text-dark fw-bold">Q</button>
                            <button type="submit" name="command" value="QQ" class="btn btn-sm btn-danger text-dark fw-bold">QQ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME BOARD (Wrapped in a form for pure HTML submission) -->
    <form th:if="${gameBoard.status != null}" action="/move" method="POST">

        <!-- TOP ROW: Foundations -->
        <div class="d-flex justify-content-end gap-3 mb-5" style="min-height: 190px;">
            <div th:each="foundationList, stat : ${ {gameBoard.f1, gameBoard.f2, gameBoard.f3, gameBoard.f4} }" class="d-flex flex-column align-items-center">

                <div class="card-dim position-relative mb-2">
                    <!-- Empty Foundation -->
                    <div th:if="${foundationList.empty}" class="card-dim rounded border border-2 border-light border-opacity-25 d-flex align-items-center justify-content-center text-light opacity-50">
                        <span class="fs-4 fw-bold" th:text="'F' + ${stat.count}"></span>
                    </div>

                    <!-- Populated Foundation (Top Card acts as a Radio Button) -->
                    <div th:if="${!foundationList.empty}" th:with="topCard=${foundationList[foundationList.size() - 1]}">
                        <input type="radio" name="source" th:value="'F' + ${stat.count}" th:id="'F' + ${stat.count} + '-top'" class="hidden-radio">
                        <label th:for="'F' + ${stat.count} + '-top'" style="cursor: pointer;">
                            <div class="card-dim rounded bg-white shadow d-flex align-items-center justify-content-center border" th:classappend="${topCard.suit == 'H' or topCard.suit == 'D'} ? 'text-danger' : 'text-dark'">
                                <span class="fs-3 fw-bold" th:text="${topCard.rank} + ${topCard.suit}"></span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Destination Button for this Foundation -->
                <button type="submit" name="destination" th:value="'F' + ${stat.count}" class="btn btn-sm btn-outline-light drop-btn">Drop F<span th:text="${stat.count}"></span></button>
            </div>
        </div>

        <!-- BOTTOM ROW: 7 Columns -->
        <div class="d-flex justify-content-center gap-3 pb-5">
            <div th:each="columnList, stat : ${ {gameBoard.c1, gameBoard.c2, gameBoard.c3, gameBoard.c4, gameBoard.c5, gameBoard.c6, gameBoard.c7} }" class="d-flex flex-column align-items-center">

                <div class="position-relative" style="width: 100px; min-height: 140px;">
                    <!-- Empty Column -->
                    <div th:if="${columnList.empty}" class="card-dim rounded border border-2 border-light border-opacity-25 d-flex align-items-center justify-content-center text-light opacity-50">
                        <span class="fs-4 fw-bold" th:text="'C' + ${stat.count}"></span>
                    </div>

                    <!-- Overlapping Cards -->
                    <div th:each="card, cardStat : ${columnList}" class="position-absolute" th:style="'top: ' + (${cardStat.index} * 30) + 'px; z-index: ' + ${cardStat.index}">

                        <!-- If card is Face Down, just show the div -->
                        <div th:if="${!card.visible}" class="card-dim rounded shadow d-flex align-items-center justify-content-center border bg-primary border-white face-down-pattern"></div>

                        <!-- If card is Face Up, wrap it in a Radio Button -->
                        <div th:if="${card.visible}">
                            <input type="radio" name="source" th:value="'C' + ${stat.count} + ':' + ${card.rank} + ${card.suit}" th:id="'C' + ${stat.count} + '-' + ${cardStat.index}" class="hidden-radio">
                            <label th:for="'C' + ${stat.count} + '-' + ${cardStat.index}" style="cursor: pointer; margin: 0;">

                                <!-- We removed the center alignment and added 'p-2' (padding) and 'text-start' -->
                                <div class="card-dim rounded shadow border bg-white p-2 text-start" th:classappend="${card.suit == 'H' or card.suit == 'D'} ? 'text-danger' : 'text-dark'">
                                    <!-- Added 'd-block lh-1' to keep the text tight to the top -->
                                    <span class="fs-4 fw-bold d-block lh-1" th:text="${card.rank} + ${card.suit}"></span>
                                </div>

                            </label>
                        </div>

                    </div>
                </div>

                <!-- Destination Button for this Column (Pushed down dynamically based on amount of cards) -->
                <button type="submit" name="destination" th:value="'C' + ${stat.count}" class="btn btn-sm btn-outline-light drop-btn" th:style="'margin-top: ' + (${columnList.size() > 0 ? (columnList.size() * 30 + 110) : 10}) + 'px;'">Drop C<span th:text="${stat.count}"></span></button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
